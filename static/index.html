<div id="toasts" class="toasts"></div>
<div id="modal-root"></div>

<script>
  window.addEventListener("error", function (event) {
    var view = document.getElementById("view");
    if (!view || view.dataset.startupError) return;
    view.dataset.startupError = "true";
    view.innerHTML = '<div class="wrap" style="padding-top:80px;text-align:center"><div class="card card-pad" style="max-width:620px;margin:0 auto"><h1 style="font-size:22px">CivicProof could not start</h1><p class="muted">Reload the page after restarting the local server.</p><p class="tiny muted" style="word-break:break-word">' + String(event.message || "Unknown browser error") + '</p></div></div>';
  });
  window.addEventListener("unhandledrejection", function (event) {
    var view = document.getElementById("view");
    if (!view || view.dataset.startupError) return;
    view.dataset.startupError = "true";
    view.innerHTML = '<div class="wrap" style="padding-top:80px;text-align:center"><div class="card card-pad" style="max-width:620px;margin:0 auto"><h1 style="font-size:22px">CivicProof could not load its data</h1><p class="muted">Restart the local server and reload this page.</p><p class="tiny muted" style="word-break:break-word">' + String(event.reason || "Unknown request error") + '</p></div></div>';
  });
</script>
